[package]
name = "bookiin"
version = "1.0.0"
description = "Bookiin - lector de libros, manga y webtoons"
authors = ["Tomika"]
edition = "2021"

[lib]
name = "bookiin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
