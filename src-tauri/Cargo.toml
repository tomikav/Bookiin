[package]
name = "ooks"
version = "0.1.0"
description = "Ooks - lector de libros y manga"
authors = ["Tomika"]
edition = "2021"

[lib]
name = "ooks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
