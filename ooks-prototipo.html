<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ooks</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Archivo:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;1,400&family=JetBrains+Mono:wght@400&display=swap');

  :root{
    color-scheme: dark;
    --ground:#0b0a0f;
    --ground-2:#0e0d13;
    --surface:#15131b;
    --surface-2:#1c1924;
    --hairline:#241f2d;
    --hairline-strong:#372f43;
    --ash:#e6e2ee;
    --ash-muted:#9a94ab;
    --ash-faint:#5f5970;
    --oxblood:#a2313f;
    --oxblood-glow:#c9424f;
    --candle:#c9a15c;
    --focus:#7d6ba0;

    --f-display:'Cormorant Garamond', 'Times New Roman', serif;
    --f-ui:'Archivo', system-ui, sans-serif;
    --f-read:'Spectral', Georgia, serif;
    --f-mono:'JetBrains Mono', ui-monospace, monospace;

    --rail:236px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 78% -12%, #17121c 0%, rgba(23,18,28,0) 60%),
      radial-gradient(900px 600px at -8% 108%, #120f18 0%, rgba(18,15,24,0) 55%),
      var(--ground);
    color:var(--ash);
    font-family:var(--f-ui);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  ::selection{background:rgba(162,49,63,.35);color:#fff}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

  /* ---------- shell ---------- */
  .app{
    display:grid;
    grid-template-columns:var(--rail) 1fr;
    height:100vh;
  }

  /* ---------- rail ---------- */
  .rail{
    border-right:1px solid var(--hairline);
    background:linear-gradient(180deg, rgba(21,19,27,.6), rgba(11,10,15,.2));
    display:flex;
    flex-direction:column;
    padding:26px 18px 20px;
    gap:34px;
    position:relative;
  }
  .brand{display:flex;align-items:center;gap:11px;padding-left:6px}
  .flame{
    width:14px;height:20px;position:relative;flex:0 0 auto;filter:drop-shadow(0 0 7px rgba(201,161,92,.55));
    animation:flicker 4.5s ease-in-out infinite;
  }
  .flame svg{display:block}
  @keyframes flicker{
    0%,100%{opacity:.92;transform:translateY(0) scale(1)}
    45%{opacity:1;transform:translateY(-.5px) scale(1.03)}
    70%{opacity:.8;transform:translateY(.3px) scale(.98)}
  }
  .wordmark{
    font-family:var(--f-display);
    font-weight:500;
    font-size:29px;
    letter-spacing:.16em;
    line-height:1;
    color:var(--ash);
  }
  .wordmark b{color:var(--oxblood);font-weight:500}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav .lbl{
    font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ash-faint);padding:0 10px 8px;font-weight:500;
  }
  .nav a{
    display:flex;align-items:center;gap:12px;
    padding:9px 10px;border-radius:8px;
    color:var(--ash-muted);text-decoration:none;
    font-size:13.5px;font-weight:500;letter-spacing:.01em;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .nav a svg{width:16px;height:16px;flex:0 0 auto;opacity:.85}
  .nav a:hover{background:var(--surface);color:var(--ash)}
  .nav a.active{background:var(--surface-2);color:var(--ash)}
  .nav a.active svg{color:var(--oxblood)}
  .nav a .count{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--ash-faint)}

  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .storage{
    border:1px solid var(--hairline);border-radius:10px;padding:12px 13px;background:rgba(21,19,27,.4);
  }
  .storage .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ash-muted)}
  .storage .row .v{font-family:var(--f-mono);color:var(--ash);font-size:11px}
  .meter{height:3px;border-radius:3px;background:var(--hairline);margin-top:9px;overflow:hidden}
  .meter i{display:block;height:100%;width:38%;background:linear-gradient(90deg,var(--oxblood),var(--oxblood-glow))}

  /* ---------- main / library ---------- */
  .stage{overflow-y:auto;overflow-x:hidden;position:relative}
  .stage::-webkit-scrollbar{width:11px}
  .stage::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
  .stage::-webkit-scrollbar-track{background:transparent}

  .lib-head{
    padding:40px 46px 20px;
    display:flex;flex-direction:column;gap:22px;
    position:sticky;top:0;z-index:6;
    background:linear-gradient(180deg, var(--ground) 62%, rgba(11,10,15,0));
  }
  .title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .h1{
    font-family:var(--f-display);
    font-weight:400;
    font-size:42px;
    line-height:.95;
    letter-spacing:.01em;
    margin:0;
    text-wrap:balance;
  }
  .h1 .sub{
    display:block;font-family:var(--f-ui);font-size:11.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ash-faint);margin-bottom:12px;font-weight:500;
  }
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{
    display:flex;align-items:center;gap:9px;
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:9px;padding:8px 12px;min-width:230px;
    transition:border-color .2s var(--ease)}
  .search:focus-within{border-color:var(--hairline-strong)}
  .search svg{width:15px;height:15px;color:var(--ash-faint);flex:0 0 auto}
  .search input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--ash)}
  .search input::placeholder{color:var(--ash-faint)}

  .selectwrap{position:relative;display:flex;align-items:center}
  .selectwrap svg{position:absolute;right:11px;width:13px;height:13px;color:var(--ash-faint);pointer-events:none}
  select.sort{
    appearance:none;-webkit-appearance:none;
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:9px;padding:9px 34px 9px 13px;font-size:13px;color:var(--ash);cursor:pointer;
    transition:border-color .2s var(--ease)}
  select.sort:hover{border-color:var(--hairline-strong)}

  .segmented{display:flex;background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:3px;gap:2px}
  .segmented button{padding:6px 9px;border-radius:6px;display:flex;color:var(--ash-faint);transition:.18s var(--ease)}
  .segmented button svg{width:16px;height:16px}
  .segmented button.on{background:var(--surface-2);color:var(--ash)}

  /* shelf grid */
  .shelf{
    padding:14px 46px 70px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
    gap:34px 26px;
    align-content:start;
  }
  .shelf.list{grid-template-columns:1fr;gap:0}

  .book{
    display:flex;flex-direction:column;gap:12px;
    cursor:pointer;position:relative;
    opacity:0;transform:translateY(14px);
    animation:rise .8s var(--ease) forwards;
  }
  @keyframes rise{to{opacity:1;transform:none}}

  .cover{
    position:relative;aspect-ratio:3/4;border-radius:5px;overflow:hidden;
    background:var(--surface);
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 34px -22px #000;
    transition:transform .45s var(--ease), box-shadow .45s var(--ease);
    isolation:isolate;
  }
  .cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cover .spine{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.15));box-shadow:1px 0 0 rgba(255,255,255,.04)}
  .cover .titleplate{
    position:absolute;inset:auto 0 0 0;padding:16px 15px 15px;
    background:linear-gradient(180deg,rgba(9,8,12,0),rgba(9,8,12,.82) 62%,rgba(9,8,12,.94));
  }
  .cover .titleplate h3{
    font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.05;margin:0;
    color:#f2eef8;text-wrap:balance;letter-spacing:.01em;
    text-shadow:0 1px 10px rgba(0,0,0,.7);
  }
  .cover .titleplate .by{font-family:var(--f-read);font-style:italic;font-size:12px;color:var(--ash-muted);margin-top:3px}
  .cover .glow{
    position:absolute;inset:-2px;z-index:-1;border-radius:8px;opacity:0;
    background:radial-gradient(60% 55% at 50% 45%, rgba(201,161,92,.32), rgba(201,161,92,0) 70%);
    transition:opacity .5s var(--ease);
  }
  .book:hover .cover{transform:translateY(-6px);box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 34px 46px -26px #000, 0 0 0 1px rgba(201,161,92,.14)}
  .book:hover .cover .glow{opacity:1}

  .kindtag{
    position:absolute;top:10px;left:10px;z-index:2;
    font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    padding:3px 7px;border-radius:20px;color:var(--ash);
    background:rgba(9,8,12,.6);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(3px);
  }
  .kindtag.manga{color:#e7b7bd;border-color:rgba(162,49,63,.5);background:rgba(60,18,24,.5)}

  .meta{display:flex;flex-direction:column;gap:7px}
  .meta .line1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .meta .code{font-family:var(--f-mono);font-size:10px;color:var(--ash-faint);letter-spacing:.04em}
  .meta .pages{font-family:var(--f-mono);font-size:10px;color:var(--ash-faint)}
  .progress{height:2px;background:var(--hairline);border-radius:2px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--oxblood),var(--oxblood-glow));box-shadow:0 0 8px rgba(201,66,79,.5)}
  .meta .status{font-size:11px;color:var(--ash-muted);letter-spacing:.02em}

  /* list layout */
  .shelf.list .book{
    flex-direction:row;align-items:center;gap:18px;
    padding:14px 8px;border-bottom:1px solid var(--hairline);
    transform:none;animation:fade .6s var(--ease) forwards;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .shelf.list .cover{width:52px;aspect-ratio:3/4;flex:0 0 auto;border-radius:3px}
  .shelf.list .cover .titleplate,.shelf.list .kindtag{display:none}
  .shelf.list .book:hover .cover{transform:none}
  .shelf.list .meta{flex:1;gap:6px}
  .shelf.list .lt{display:flex;flex-direction:column;gap:3px;flex:1}
  .shelf.list .lt h3{font-family:var(--f-display);font-size:20px;font-weight:500;margin:0;color:var(--ash)}
  .shelf.list .lt .by{font-family:var(--f-read);font-style:italic;font-size:12.5px;color:var(--ash-muted)}
  .list-only{display:none}
  .shelf.list .list-only{display:flex}
  .shelf.list .progress{width:150px;flex:0 0 auto}

  .empty{padding:60px 46px;color:var(--ash-faint);font-style:italic;font-family:var(--f-read)}

  /* ---------- reader ---------- */
  .reader{
    position:fixed;inset:0;z-index:40;
    background:#050406;
    display:none;
    flex-direction:column;
    opacity:0;
  }
  .reader.open{display:flex;animation:readerIn .5s var(--ease) forwards}
  @keyframes readerIn{to{opacity:1}}
  .reader.closing{animation:readerOut .32s var(--ease) forwards}
  @keyframes readerOut{to{opacity:0}}

  .r-chrome{position:absolute;left:0;right:0;z-index:3;transition:opacity .4s var(--ease), transform .4s var(--ease)}
  .reader.idle .r-chrome{opacity:0;pointer-events:none}
  .reader.idle .r-top{transform:translateY(-8px)}
  .reader.idle .r-bottom{transform:translateY(8px)}

  .r-top{
    top:0;padding:16px 22px;
    display:flex;align-items:center;gap:16px;
    background:linear-gradient(180deg,rgba(5,4,6,.92),rgba(5,4,6,0));
  }
  .r-back{display:flex;align-items:center;gap:9px;color:var(--ash-muted);font-size:13px;font-weight:500;padding:6px 8px;border-radius:8px;transition:.2s var(--ease)}
  .r-back:hover{color:var(--ash);background:rgba(255,255,255,.05)}
  .r-back svg{width:16px;height:16px}
  .r-titleblock{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .r-titleblock .t{font-family:var(--f-display);font-size:19px;font-weight:500;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-titleblock .a{font-family:var(--f-read);font-style:italic;font-size:11.5px;color:var(--ash-faint)}
  .r-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
  .r-count{font-family:var(--f-mono);font-size:12px;color:var(--ash-muted);letter-spacing:.05em;font-variant-numeric:tabular-nums;padding:0 6px}
  .modetoggle{display:flex;background:rgba(21,19,27,.7);border:1px solid var(--hairline);border-radius:8px;padding:3px;gap:2px;backdrop-filter:blur(4px)}
  .modetoggle button{padding:6px 8px;border-radius:6px;color:var(--ash-faint);display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;transition:.18s var(--ease)}
  .modetoggle button svg{width:15px;height:15px}
  .modetoggle button.on{background:var(--surface-2);color:var(--ash)}
  .icbtn{padding:7px;border-radius:8px;color:var(--ash-faint);display:flex;transition:.18s var(--ease)}
  .icbtn:hover{color:var(--ash);background:rgba(255,255,255,.05)}
  .icbtn svg{width:17px;height:17px}

  /* reader stage */
  .r-viewport{flex:1;overflow:hidden;position:relative}
  .r-viewport.vertical{overflow-y:auto}
  .r-viewport::-webkit-scrollbar{width:10px}
  .r-viewport::-webkit-scrollbar-thumb{background:#2a2431;border-radius:10px;border:3px solid transparent;background-clip:padding-box}

  /* horizontal: one page centered */
  .r-track{height:100%;display:flex;align-items:center;justify-content:center;padding:54px 24px 64px}
  .r-track.vertical{height:auto;flex-direction:column;gap:8px;padding:70px 24px 90px;justify-content:flex-start}
  .page{
    position:relative;
    width:min(560px,92%);
    aspect-ratio:2/3;
    border-radius:3px;overflow:hidden;
    background:#070609;
    box-shadow:0 30px 70px -30px #000, 0 0 0 1px rgba(255,255,255,.04);
    flex:0 0 auto;
  }
  .r-track.vertical .page{width:min(620px,96%)}
  .page svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* the signature reveal: emerges from darkness */
  .page .veil{position:absolute;inset:0;background:#050406;z-index:2;pointer-events:none}
  .page.reveal .art{animation:pageArt .95s var(--ease) both}
  .page.reveal .veil{animation:pageVeil 1.05s var(--ease) both}
  @keyframes pageVeil{
    0%{clip-path:inset(0 0 0 0)}
    100%{clip-path:inset(100% 0 0 0)}
  }
  @keyframes pageArt{
    0%{filter:brightness(.25) blur(6px);transform:scale(1.03)}
    60%{filter:brightness(.9) blur(1px)}
    100%{filter:brightness(1) blur(0);transform:none}
  }

  /* click zones (horizontal) */
  .zone{position:absolute;top:0;bottom:0;width:32%;z-index:2;cursor:pointer}
  .zone.left{left:0}.zone.right{right:0}
  .r-viewport.vertical .zone{display:none}

  .r-bottom{
    bottom:0;padding:16px 26px 20px;
    display:flex;align-items:center;gap:16px;
    background:linear-gradient(0deg,rgba(5,4,6,.94),rgba(5,4,6,0));
  }
  .scrub{flex:1;display:flex;align-items:center;gap:14px}
  .scrub .num{font-family:var(--f-mono);font-size:11px;color:var(--ash-faint);font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
  .rail-track{flex:1;height:26px;display:flex;align-items:center;cursor:pointer}
  .rail-line{position:relative;height:3px;width:100%;background:#241f2d;border-radius:3px}
  .rail-line .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--oxblood),var(--oxblood-glow));border-radius:3px}
  .rail-line .knob{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#f2eef8;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(201,66,79,.7)}
  .ticks{position:absolute;inset:0;display:flex}
  .ticks span{flex:1;border-right:1px solid rgba(255,255,255,.05)}
  .ticks span:last-child{border:none}

  .hint{
    position:absolute;left:50%;bottom:78px;transform:translateX(-50%);
    font-size:11px;color:var(--ash-faint);letter-spacing:.06em;
    background:rgba(9,8,12,.7);border:1px solid var(--hairline);border-radius:20px;padding:6px 14px;
    display:flex;align-items:center;gap:10px;z-index:3;
    transition:opacity .4s var(--ease);
  }
  .hint kbd{font-family:var(--f-mono);font-size:10px;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:4px;padding:1px 5px;color:var(--ash-muted)}

  /* responsive */
  @media (max-width:820px){
    :root{--rail:0px}
    .rail{display:none}
    .app{grid-template-columns:1fr}
    .lib-head{padding:26px 20px 16px}
    .shelf{padding:12px 20px 60px;gap:26px 18px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
    .h1{font-size:32px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
    .page.reveal .veil{clip-path:inset(100% 0 0 0)}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ================= RAIL ================= -->
  <aside class="rail">
    <div class="brand">
      <span class="flame" aria-hidden="true">
        <svg viewBox="0 0 14 20" width="14" height="20"><path d="M7 0C7 5 2 6 2 12a5 5 0 0 0 10 0c0-2.5-1.6-3.7-2.4-5.2C8.6 9 8 10 6.6 10 8 7.4 7 3.4 7 0Z" fill="#c9a15c"/><path d="M7 8c0 2.6-2 3-2 5.4A2 2 0 0 0 9 13.4C9 11.4 7 11 7 8Z" fill="#f0d79a"/></svg>
      </span>
      <span class="wordmark">O<b>o</b>ks</span>
    </div>

    <nav class="nav">           
      <span class="lbl">Colección</span>
      <a href="#" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H10a2 2 0 0 1 2 2v13a1.5 1.5 0 0 0-1.5-1.5H4Z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H14a2 2 0 0 0-2 2v13a1.5 1.5 0 0 1 1.5-1.5H20Z"/></svg>
        Biblioteca <span class="count" id="navcount">—</span>
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>
        Continuar leyendo
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6"/></svg>
        Añadidos hace poco
      </a>
      <span class="lbl" style="margin-top:20px">Estantes</span>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V6a2 2 0 0 1 2-2h8l6 6v9"/><path d="M14 4v6h6"/></svg>
        Manga &amp; cómic
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
        Novelas
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>
        Sin clasificar
      </a>
    </nav>

    <div class="rail-foot">
      <div class="storage">
        <div class="row"><span>Almacenamiento</span><span class="v">3.1 GB</span></div>
        <div class="meter"><i></i></div>
        <div class="row" style="margin-top:8px"><span>Volúmenes</span><span class="v" id="volcount">—</span></div>
      </div>
    </div>
  </aside>

  <!-- ================= LIBRARY ================= -->
  <main class="stage" id="stage">
    <header class="lib-head">
      <div class="title-row">
        <h1 class="h1"><span class="sub">Tu colección · medianoche</span>Biblioteca</h1>
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>

<script>

const books = [

/* ---------------- procedural cover art ---------------- */
function symbolMarkup(name, ink){
  const s = {
    tree:`<g stroke="${ink}" fill="none" stroke-width="1.4" opacity=".55"><path d="M150 250V150"/><path d="M150 168c-14-16-30-16-42-30M150 168c14-16 30-16 42-30M150 138c-10-14-24-12-32-26M150 138c10-14 24-12 32-26M150 118c-7-11-16-10-22-22M150 118c7-11 16-10 22-22"/></g><circle cx="150" cy="86" r="30" fill="none" stroke="${ink}" stroke-width="1" opacity=".3"/>`,
    eye:`<g fill="none" stroke="${ink}" stroke-width="1.5" opacity=".6"><path d="M100 165q50-46 100 0q-50 46-100 0z"/><circle cx="150" cy="165" r="20"/></g><circle cx="150" cy="165" r="7" fill="${ink}" opacity=".85"/><g stroke="${ink}" stroke-width="1" opacity=".25"><path d="M150 118v-22M150 234v-22M92 165H70M230 165h-22"/></g>`,
    door:`<g fill="none" stroke="${ink}" stroke-width="1.4" opacity=".55"><rect x="110" y="96" width="80" height="150" rx="40"/><rect x="122" y="112" width="56" height="134" rx="28"/></g><circle cx="168" cy="176" r="3.2" fill="${ink}"/><rect x="126" y="248" width="48" height="1.5" fill="${ink}" opacity=".3"/>`,
    wave:`<g fill="none" stroke="${ink}" stroke-width="1.4" opacity=".5"><path d="M70 150q20-16 40 0t40 0 40 0 40 0"/><path d="M70 172q20-16 40 0t40 0 40 0 40 0"/><path d="M70 194q20-16 40 0t40 0 40 0 40 0"/><path d="M70 128q20-16 40 0t40 0 40 0 40 0"/></g>`,
    ribs:`<g fill="none" stroke="${ink}" stroke-width="1.4" opacity=".55"><path d="M150 96v150"/><path d="M150 120q-34 6-40 30M150 120q34 6 40 30M150 148q-32 6-36 28M150 148q32 6 36 28M150 176q-28 6-30 26M150 176q28 6 30 26"/></g>`,
    sigil:`<g fill="none" stroke="${ink}" stroke-width="1.2" opacity=".55"><circle cx="150" cy="165" r="52"/><path d="M150 118l45 70h-90z"/><path d="M150 150v40M132 178h36"/></g><circle cx="150" cy="165" r="66" fill="none" stroke="${ink}" stroke-width=".7" opacity=".25"/>`,
    moth:`<g fill="none" stroke="${ink}" stroke-width="1.3" opacity=".55"><path d="M150 150c-30-34-64-24-64 6s34 40 64 26M150 150c30-34 64-24 64 6s-34 40-64 26M150 138v56"/></g><circle cx="118" cy="158" r="4" fill="${ink}" opacity=".5"/><circle cx="182" cy="158" r="4" fill="${ink}" opacity=".5"/>`,
    candle:`<g fill="none" stroke="${ink}" stroke-width="1.4" opacity=".6"><rect x="138" y="150" width="24" height="86"/><path d="M150 150v-18"/></g><path d="M150 108c0 12-9 14-9 24a9 9 0 0 0 18 0c0-8-9-12-9-24z" fill="${ink}" opacity=".55"/>`,
    moon:`<path d="M172 110a56 56 0 1 0 0 110 46 46 0 1 1 0-110z" fill="${ink}" opacity=".5"/><circle cx="150" cy="165" r="64" fill="none" stroke="${ink}" stroke-width=".7" opacity=".25"/>`,
    key:`<g fill="none" stroke="${ink}" stroke-width="1.5" opacity=".6"><circle cx="150" cy="120" r="22"/><path d="M150 142v88M150 200h16M150 214h12"/></g><circle cx="150" cy="120" r="7" fill="none" stroke="${ink}" stroke-width="1.5" opacity=".6"/>`,
    hourglass:`<g fill="none" stroke="${ink}" stroke-width="1.4" opacity=".6"><path d="M118 108h64M118 224h64M122 108c0 34 28 40 28 58 0-18 28-24 28-58M122 224c0-34 28-40 28-58 0 18 28 24 28 58"/></g><path d="M150 166c-8 8-14 22-14 40h28c0-18-6-32-14-40z" fill="${ink}" opacity=".4"/>`,
    spiral:`<path d="M150 165m0 0a8 8 0 1 1 8 8 18 18 0 1 1-18-18 30 30 0 1 1 30 30 44 44 0 1 1-44-44" fill="none" stroke="${ink}" stroke-width="1.4" opacity=".55"/>`
  };
  return s[name]||s.sigil;
}
function coverSVG(b){
  const id=b.id;
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="cg${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${b.grad[0]}"/><stop offset="1" stop-color="${b.grad[1]}"/>
      </linearGradient>
      <radialGradient id="cv${id}" cx="0.5" cy="0.42" r="0.75">
        <stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.72"/>
      </radialGradient>
      <filter id="cn${id}"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer><feComposite operator="in" in2="SourceGraphic"/></filter>
    </defs>
    <rect width="300" height="400" fill="url(#cg${id})"/>
    <g transform="translate(0,20)">${symbolMarkup(b.sym,b.ink)}</g>
    <rect width="300" height="400" fill="url(#cv${id})"/>
    <rect width="300" height="400" fill="#fff" filter="url(#cn${id})"/>
  </svg>`;
}

/* ---------------- library render ---------------- */
const shelf=document.getElementById('shelf');
const kindLabel={manga:'Manga',novela:'Novela',ensayo:'Ensayo',poesía:'Poesía'};
let view='grid', sortKey='recent', query='';

function statusText(b){
  if(b.prog===0) return 'Sin empezar';
  if(b.prog>=1) return 'Terminado';
  return 'Página '+Math.round(b.prog*b.pages)+' · '+Math.round(b.prog*100)+'%';
}
function sortBooks(list){
  const c=[...list];
  if(sortKey==='recent') c.sort((a,b)=>a.recent-b.recent);
  else if(sortKey==='added') c.sort((a,b)=>a.added-b.added);
  else if(sortKey==='title') c.sort((a,b)=>a.t.localeCompare(b.t));
  else if(sortKey==='author') c.sort((a,b)=>a.a.localeCompare(b.a));
  else if(sortKey==='progress') c.sort((a,b)=>b.prog-a.prog);
  return c;
}
function render(){
  const q=query.trim().toLowerCase();
  let list=books.filter(b=>!q||b.t.toLowerCase().includes(q)||b.a.toLowerCase().includes(q));
  list=sortBooks(list);
  shelf.className='shelf'+(view==='list'?' list':'');
  if(!list.length){shelf.innerHTML='<p class="empty">Nada en las sombras con ese nombre.</p>';return;}
  shelf.innerHTML=list.map((b,i)=>{
    const isManga=b.kind==='manga';
    const delay=Math.min(i*55,560);
    return `<article class="book" data-id="${b.id}" style="animation-delay:${delay}ms">
      <div class="cover">
        <span class="glow"></span>
        ${coverSVG(b)}
        <span class="spine"></span>
        <span class="kindtag ${isManga?'manga':''}">${kindLabel[b.kind]||b.kind}</span>
        <div class="titleplate grid-hideinlist">
          <h3>${b.t}</h3>
          <div class="by">${b.a}</div>
        </div>
      </div>
      <div class="lt list-only">
        <h3>${b.t}</h3><div class="by">${b.a}</div>
      </div>
      <div class="meta">
        <div class="line1"><span class="code">${b.code}</span><span class="pages">${b.pages} p.</span></div>
        <div class="progress"><i style="width:${Math.round(b.prog*100)}%"></i></div>
        <div class="status list-only-hide">${statusText(b)}</div>
      </div>
    </article>`;
  }).join('');
}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
document.getElementById('sort').addEventListener('change',e=>{sortKey=e.target.value;render();});
document.getElementById('viewtoggle').addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  view=btn.dataset.view;
  [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===btn));
  render();
});
shelf.addEventListener('click',e=>{
  const card=e.target.closest('.book');if(!card)return;
  openReader(+card.dataset.id);
});
document.getElementById('navcount').textContent=books.length;
document.getElementById('volcount').textContent=books.length;

/* ---------------- reader page art ---------------- */
function pageSVG(n,total,ink){
  // pick a panel template deterministically
  const tpl=n%4;
  const layouts=[
    [[24,60,252,150],[24,222,120,150],[156,222,120,150]],
    [[24,60,252,110],[24,182,252,90],[24,284,252,88]],
    [[24,60,120,312],[156,60,120,150],[156,222,120,150]],
    [[24,60,252,312]]
  ];
  const panels=layouts[tpl];
  let inner='';
  panels.forEach((p,i)=>{
    const [x,y,w,h]=p, cx=x+w/2, cy=y+h/2;
    inner+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0c0a10" stroke="#2a2431" stroke-width="1"/>`;
    // faint scene art
    inner+=`<g clip-path="inset(0)" opacity=".8"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#pg${n})"/></g>`;
    if((i+n)%3===0){ // a figure silhouette
      inner+=`<path d="M${cx} ${y+h-14} q-2 -${h*0.34} 3 -${h*0.42} q1 -14 -6 -20 q6 -3 12 0 q-7 6 -6 20 q5 .08 3 ${h*0.42}z" fill="#05040688" stroke="${ink}" stroke-width=".7" opacity=".5"/>`;
    } else if((i+n)%3===1){ // speed lines
      let sl='';for(let k=0;k<7;k++){const yy=y+10+k*(h-20)/6;sl+=`<path d="M${x+8} ${yy} L${x+w-8} ${cy}" stroke="${ink}" stroke-width=".6" opacity=".3"/>`;}
      inner+=sl;
    } else { // a distant moon / horizon
      inner+=`<circle cx="${x+w*0.7}" cy="${y+h*0.32}" r="${Math.min(w,h)*0.16}" fill="none" stroke="${ink}" stroke-width="1" opacity=".45"/><path d="M${x} ${y+h*0.66} q${w*0.5} -18 ${w} 0" stroke="${ink}" stroke-width=".8" opacity=".35" fill="none"/>`;
    }
    // occasional speech balloon
    if(i===0 && n%2===0){
      inner+=`<ellipse cx="${x+w*0.32}" cy="${y+h*0.26}" rx="${w*0.2}" ry="${h*0.1}" fill="#efeaf2" opacity=".9"/><path d="M${x+w*0.24} ${y+h*0.34} l-8 12 l16 -8z" fill="#efeaf2" opacity=".9"/>`;
      inner+=`<line x1="${x+w*0.18}" y1="${y+h*0.22}" x2="${x+w*0.46}" y2="${y+h*0.22}" stroke="#2a2431" stroke-width="1.4"/><line x1="${x+w*0.2}" y1="${y+h*0.28}" x2="${x+w*0.42}" y2="${y+h*0.28}" stroke="#2a2431" stroke-width="1.4"/>`;
    }
  });
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="pg${n}" cx="0.5" cy="0.35" r="0.9"><stop offset="0" stop-color="#1a1622"/><stop offset="1" stop-color="#08070b"/></radialGradient>
    </defs>
    <rect width="300" height="400" fill="#08070b"/>
    ${inner}
    <text x="278" y="388" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4a4557">${String(n).padStart(2,'0')} / ${String(total).padStart(2,'0')}</text>
  </svg>`;
}

/* ---------------- reader logic ---------------- */
const reader=document.getElementById('reader');
const viewport=document.getElementById('viewport');
const track=document.getElementById('track');
let R={book:null,page:1,total:1,mode:'horizontal'};

function buildTicks(total){
  const t=document.getElementById('ticks');
  t.innerHTML=Array.from({length:Math.min(total,40)},()=>'<span></span>').join('');
}
function renderPages(){
  const b=R.book;
  if(R.mode==='horizontal'){
    track.classList.remove('vertical');
    viewport.classList.remove('vertical');
    track.innerHTML=`<div class="page reveal" id="curpage"><div class="art">${pageSVG(R.page,R.total,b.ink)}</div><div class="veil"></div></div>`;
  } else {
    track.classList.add('vertical');
    viewport.classList.add('vertical');
    let html='';
    for(let p=1;p<=R.total;p++){
      html+=`<div class="page" data-p="${p}"><div class="art">${pageSVG(p,R.total,b.ink)}</div><div class="veil" style="display:none"></div></div>`;
    }
    track.innerHTML=html;
    // reveal on scroll
    requestAnimationFrame(()=>observeVertical());
  }
  updateChrome();
}
let io=null;
function observeVertical(){
  if(io)io.disconnect();
  io=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const pg=en.target;
        if(!pg.dataset.shown){
          pg.dataset.shown='1';
          pg.querySelector('.veil').style.display='block';
          pg.classList.add('reveal');
        }
        R.page=+pg.dataset.p; updateChrome(false);
      }
    });
  },{root:viewport,threshold:.35});
  track.querySelectorAll('.page').forEach(p=>io.observe(p));
}
function updateChrome(){
  document.getElementById('rcount').textContent=String(R.page).padStart(2,'0')+' / '+String(R.total).padStart(2,'0');
  document.getElementById('scnum').textContent=R.page;
  document.getElementById('sctotal').textContent=R.total;
  const pct=R.total>1?((R.page-1)/(R.total-1))*100:0;
  document.getElementById('scfill').style.width=pct+'%';
  document.getElementById('scknob').style.left=pct+'%';
}
function goPage(n){
  n=Math.max(1,Math.min(R.total,n));
  if(n===R.page && R.mode==='horizontal') { flashReveal(); return; }
  R.page=n;
  if(R.mode==='horizontal'){ renderPages(); }
  else{
    const el=track.querySelector('.page[data-p="'+n+'"]');
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  }
  wake();
}
function flashReveal(){
  const cur=document.getElementById('curpage');
  if(!cur)return;
  cur.classList.remove('reveal');void cur.offsetWidth;cur.classList.add('reveal');
}
function openReader(id){
  const b=books[id];R.book=b;R.total=Math.min(b.pages,24);
  R.page=b.prog>0?Math.max(1,Math.round(b.prog*R.total)):1;
  document.getElementById('rtitle').textContent=b.t;
  document.getElementById('rauthor').textContent=b.a;
  buildTicks(R.total);
  R.mode='horizontal';
  [...document.getElementById('modetoggle').children].forEach(c=>c.classList.toggle('on',c.dataset.mode==='horizontal'));
  renderPages();
  reader.classList.add('open');reader.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  showHint();wake();
}
function closeReader(){
  reader.classList.add('closing');
  setTimeout(()=>{reader.classList.remove('open','closing');reader.setAttribute('aria-hidden','true');},320);
}
document.getElementById('rback').addEventListener('click',closeReader);
document.getElementById('zoneL').addEventListener('click',()=>goPage(R.page-1));
document.getElementById('zoneR').addEventListener('click',()=>goPage(R.page+1));
document.getElementById('modetoggle').addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  R.mode=btn.dataset.mode;
  [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===btn));
  renderPages();
  if(R.mode==='vertical'){setTimeout(()=>{const el=track.querySelector('.page[data-p="'+R.page+'"]');if(el)el.scrollIntoView({block:'start'});},40);}
  wake();
});
// scrub bar
const railtrack=document.getElementById('railtrack');
function scrubTo(clientX){
  const r=railtrack.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
  goPage(Math.round(pct*(R.total-1))+1);
}
let scrubbing=false;
railtrack.addEventListener('pointerdown',e=>{scrubbing=true;railtrack.setPointerCapture(e.pointerId);scrubTo(e.clientX);});
railtrack.addEventListener('pointermove',e=>{if(scrubbing)scrubTo(e.clientX);});
railtrack.addEventListener('pointerup',()=>scrubbing=false);
document.getElementById('fsbtn').addEventListener('click',()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
  else document.exitFullscreen&&document.exitFullscreen();
});
// keyboard
document.addEventListener('keydown',e=>{
  if(!reader.classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){goPage(R.page+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){goPage(R.page-1);e.preventDefault();}
  else if(e.key==='Escape')closeReader();
});

/* auto-hide chrome */
let idleT=null;
function wake(){reader.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(reader.classList.contains('open'))reader.classList.add('idle');},2600);}
reader.addEventListener('pointermove',wake);
reader.addEventListener('click',wake);
let hintT=null;
function showHint(){const h=document.getElementById('hint');h.style.opacity='1';clearTimeout(hintT);hintT=setTimeout(()=>{h.style.opacity='0';},3400);}

render();
</script>

</body>
</html>
